workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 120
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.pgpchatv2
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build iOS IPA
        script: |
          # App Store Connect already has build 14 for version 1.0.5.
          # The offset keeps every Codemagic archive strictly above 14.
          UPDATED_BUILD_NUMBER=$((15 + BUILD_NUMBER))
          flutter build ipa --release --build-name=1.0.5 --build-number=$UPDATED_BUILD_NUMBER
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
